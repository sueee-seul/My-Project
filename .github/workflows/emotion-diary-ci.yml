name: CI - Emotion Diary

on:
  push:
    branches: [main]
    paths:
      - "Emotion_diary/**"
      - ".github/workflows/emotion-diary-ci.yml"
  pull_request:
    paths:
      - "Emotion_diary/**"
      - ".github/workflows/emotion-diary-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Emotion_diary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: Emotion_diary/package-lock.json

      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
