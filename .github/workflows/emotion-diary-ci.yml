name: CI - Emotion Diary

on:
  push:
  branches: [main]
  paths:
    - "Emotion_diary/**""
    -".github/workflows/emotion-diary-ci.yml"
  pull_request:
    paths:
      - "Emotion_diary/**"
      -".github/workflows/emotion-diary-ci.yml"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Emotion_diary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Emotion_diary/package-lock.json

      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
